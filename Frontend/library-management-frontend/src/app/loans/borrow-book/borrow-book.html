<div class="borrow-page">
  <div class="page-header">
    <div class="page-title">
      <h2>Borrow Book</h2>
      <p>Issue a book to a library member</p>
    </div>
  </div>

  <div class="borrow-card">
    <div class="card-header">
      <h3>Borrow Details</h3>
      <p>Select a member and an available book to create a loan.</p>
    </div>

    <div class="form-wrapper">
      <form #borrowForm="ngForm" (ngSubmit)="borrowBook()">
        <div class="form-group">
          <label>Member</label>

          <select [(ngModel)]="memberId" name="memberId" required #memberInput="ngModel">
            <option [ngValue]="null">Select Member</option>

            @for (member of members; track member.id) {
              <option [ngValue]="member.id">{{ member.name }} - {{ member.email }}</option>
            }
          </select>

          @if (memberInput.invalid && memberInput.touched) {
            <small>Member is required.</small>
          }
        </div>

        <div class="form-group">
          <label>Book</label>

          <select [(ngModel)]="bookId" name="bookId" required #bookInput="ngModel">
            <option [ngValue]="null">Select Book</option>

            @for (book of books; track book.id) {
              <option [ngValue]="book.id" [disabled]="book.availableCopies === 0">
                {{ book.title }} - {{ book.author }} ({{ book.availableCopies }} available)
              </option>
            }
          </select>

          @if (bookInput.invalid && bookInput.touched) {
            <small>Book is required.</small>
          }
        </div>

        <div class="form-actions">
          <button type="submit" class="borrow-btn" [disabled]="borrowForm.invalid">
            Borrow Book
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
